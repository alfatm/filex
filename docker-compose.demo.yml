# filex production stack: local image + PostgreSQL + Cloudflare tunnel.
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f filex   # first-run admin creds
#
# Config comes from `.env` next to this file (Compose reads it by default).
# Add to it:
#   FILEX_PUBLIC_URL=https://your.domain      # exactly what users type
#   POSTGRES_PASSWORD=…                       # openssl rand -hex 24
#   FILEX_SECRET_KEY=…                        # openssl rand -hex 32
#   TUNNEL_TOKEN=…                            # Zero Trust → Networks → Tunnels
#   FILEX_STORAGE_DIR=/srv/filex/home         # host dir for the files
#
# In the tunnel's dashboard, point the public hostname at `HTTP filex:5212` —
# the compose service name, not localhost.
#

name: filex-prod

services:
  filex:
    image: ${FILEX_IMAGE:-ghcr.io/brf-tech/filex:slim}
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.slim
    # No published port: cloudflared reaches filex over this network, and
    # publishing would put the app on the host as plain HTTP beside the tunnel.
    expose:
      - "5212"
    environment:
      FILEX_PUBLIC_URL: ${FILEX_PUBLIC_URL:?set FILEX_PUBLIC_URL}
      FILEX_LISTEN: 0.0.0.0:5212

      FILEX_DB_DRIVER: postgres
      FILEX_DB_DSN: postgres://filex:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filex?sslmode=disable

      # ⚠ The queue does NOT follow FILEX_DB_DRIVER: unset, it picks the driver
      # named "sqlite", which is handed the application's own *sql.DB — a
      # Postgres handle here — rather than a SQLite file.
      FILEX_QUEUE_DRIVER: postgres
      FILEX_QUEUE_DSN: postgres://filex:${POSTGRES_PASSWORD}@postgres:5432/filex?sslmode=disable

      # ⚠ Set before anyone mints an S3 access key: the secret is sealed with
      # this, not hashed. Losing it stops every existing key verifying.
      FILEX_SECRET_KEY: ${FILEX_SECRET_KEY:?set FILEX_SECRET_KEY}

      FILEX_DEFAULT_STORAGE_DRIVER: local
      FILEX_DEFAULT_STORAGE_PATH: /data/home
      FILEX_THUMBS_ENABLED: "true"

      # Blank → filex generates a password on first boot, prints it once and
      # writes it to /data/.first-run.txt (0600).
      FILEX_ADMIN_EMAIL: ${FILEX_ADMIN_EMAIL:-}
      FILEX_ADMIN_PASSWORD: ${FILEX_ADMIN_PASSWORD:-}
    volumes:
      - ${FILEX_HOME_DIR:-./data/home}:/data/home
      - ${FILEX_STORAGE_DIR:-./data/storage}:/data/storage:rw
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5212/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: filex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: filex
    volumes:
      - ${FILEX_POSTGRES_DATA_DIR:-./data/postgresql}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filex"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      filex:
        condition: service_healthy
    restart: unless-stopped
