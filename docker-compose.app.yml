# A local filex instance: the server, plus the end-user app in front of it.
#
#   docker compose -f docker-compose.app.yml up --build
#
# Then, in this order:
#   1. http://localhost:5212/  — sign in as admin@filex.test / FilexTest1!
#   2. http://localhost:5175/ — the end-user app, now talking to that server
#
# The order matters and the second step needs no second login: a cookie is
# scoped by DOMAIN, not by port, so the session minted on :5212 is sent to
# :5175 as well. That port is deliberately NOT 5174: a `pnpm dev` running on
# the host owns that one, and the stack must not fight it for it. The app
# itself has no login screen — it is the signed-in surface, and the admin SPA
# is where an account signs in.
#
# This file and `docker-compose.yml` are ALTERNATIVES, not companions: both
# name their server container `filex`, so running the two at once fails on the
# name rather than starting two servers that would fight over nothing.
#
# The app is served by Vite rather than by filex because filex does not embed
# it — `backend/embed` carries the admin SPA and the embed widget and nothing
# else, and the Go server has no `/app` route at all. What Vite serves is the
# BUILT bundle (`vite preview`), NOT the dev server: the dev server carries the
# screenshot/e2e URL hooks (`?modal=`, `?caps=`, `?demo=`, see
# `app/src/dev/screenshotQuery.ts`) that monkeypatch the repository, fake
# capabilities and post mock rows, and pointed at a real server those turn the
# demo into a claim the server never made. The price is that an edit on the host
# is not live here — restart the `app` container, or run `pnpm --filter ./app
# dev` on the host while you are editing.
#
# `packages/core` is BUILT here as well. The app imports it through that
# package's `exports`, which point at `dist/`, and `dist/` is gitignored — so on
# a fresh clone nothing that imports core resolves until this build has run. It
# is why the first `up` takes minutes before :5175 answers.
#
# What is NOT production shape, and would have to change before this faced
# anyone but you: the admin password below, a server whose database and drive
# are throwaway volumes, and the app on Vite's preview server rather than behind
# a real one. `docker compose -f
# docker-compose.app.yml down -v` erases the lot and gives a fresh install on
# the next `up`.
#
# Every `${VAR:-default}` below is also read from a `.env` next to this file —
# the same one `docker-compose.yml` uses, so `cp .env.example .env` and the
# "App stand" block in it is the whole setup. Compose takes the file from the
# directory of this compose file, not from the shell's cwd, and a variable
# exported in the shell still wins over the file. To keep the stand's values
# apart from a production `.env`, point at another file:
#   docker compose -f docker-compose.app.yml --env-file .env.app up --build

name: filex-app

services:
  # ---------------------------------------------------------------------
  # filex, built from THIS working tree rather than from a published image:
  # the instance is meant to run the endpoints in the branch you are on.
  # ---------------------------------------------------------------------
  filex:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: filex
    ports:
      - "${FILEX_PORT:-5212}:5212"
    volumes:
      - filex-data:/data
      - filex-storage:/srv/files
      # The demo files, read-only, so there is something real to browse. Env
      # seeding only ever creates ONE drive, so this one is added by hand:
      # Storages → New → local, path /srv/demo, read-only. Skip it and the
      # stack still works — the writable drive above just starts empty.
      - ${DEMO_ASSETS_DIR:-./storage-data}:/srv/demo:rw
    environment:
      FILEX_PUBLIC_URL: http://localhost:${FILEX_PORT:-5212}
      FILEX_LISTEN: 0.0.0.0:5212
      FILEX_DB_DRIVER: sqlite
      FILEX_DB_DSN: /data/filex.db

      # First boot creates this account and skips the setup wizard. Both are
      # test credentials on purpose — never copy this block into a real deploy.
      FILEX_ADMIN_EMAIL: ${FILEX_ADMIN_EMAIL:-admin@filex.test}
      FILEX_ADMIN_PASSWORD: ${FILEX_ADMIN_PASSWORD:-FilexTest1!}

      # First boot also creates one writable drive. Its NAME is what the app
      # addresses every node by (`home://Docs/report.pdf`), so it is worth
      # keeping short and recognisable in the URL bar.
      FILEX_DEFAULT_STORAGE_DRIVER: local
      FILEX_DEFAULT_STORAGE_NAME: ${FILEX_STORAGE_NAME:-home}
      FILEX_DEFAULT_STORAGE_PATH: /srv/files

      FILEX_THUMBS_ENABLED: "true"
      # Files already catalogued before the sync walk started asking for
      # thumbnails get theirs on the next start; rows that are ready are
      # skipped, so a repeat boot costs one lookup per file.
      FILEX_THUMB_BACKFILL_ON_BOOT: once

      # Encrypts the secrets filex has to read back (internal/secretbox) — the
      # assistant refuses to store its provider key without one, so no model can
      # be configured until this is set.
      #
      # The default is a fixed string, which means anyone holding this file can
      # read the secrets of an instance that kept it. That is fine for a machine
      # only you reach and wrong the moment it is not, so it is overridable:
      # set FILEX_SECRET_KEY in `.env` (or export it) before `up`. Changing it
      # later makes the secrets already stored unreadable — they are re-entered,
      # not migrated.
      FILEX_SECRET_KEY: ${FILEX_SECRET_KEY:-app-stand-not-a-real-key}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5212/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------
  # The end-user app: built inside the container, then served by `vite preview`.
  # `VITE_FILEX_API` is what switches `src/data/index.ts` off the mock
  # repository and onto the HTTP one — and it is read at BUILD time now, not at
  # run time, because a production build without it refuses to run at all
  # (app/vite.config.ts) rather than shipping demo data that looks real.
  # ---------------------------------------------------------------------
  app:
    image: node:20-alpine
    container_name: filex-app
    working_dir: /repo
    depends_on:
      filex:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5175}:5174"
    environment:
      VITE_FILEX_API: "1"
      # Same-origin from the browser's side: the preview server forwards /api,
      # so the session cookie rides along and nothing needs CORS.
      FILEX_API_PROXY: http://filex:5212
      VITE_HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - ./:/repo
      # Dependencies are installed INSIDE the container and kept out of the
      # bind mount: esbuild and rollup ship native binaries, and the host's
      # copies are built for the host's libc, not this image's musl.
      - app-node-modules:/repo/node_modules
      - app-pkg-node-modules:/repo/app/node_modules
      - pnpm-store:/pnpm-store
    command:
      - sh
      - -c
      - |
        set -e
        corepack enable
        pnpm config set store-dir /pnpm-store
        pnpm install --filter @brftech/filex-app... --no-frozen-lockfile
        pnpm --filter @brftech/filex-core build
        pnpm --filter @brftech/filex-app build
        pnpm --filter @brftech/filex-app preview

volumes:
  filex-data:
  filex-storage:
  app-node-modules:
  app-pkg-node-modules:
  pnpm-store:
