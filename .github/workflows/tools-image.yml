name: Toolchain image

# Publishes <IMAGE_BASE>/filex-tools — the programs the thumbnailer shells out
# to, which the `full` filex image is built on. It is the `tools` stage of
# docker/Dockerfile, published as an image.
#
# What this workflow buys is CACHING, not capability: `full` builds from source
# with --build-arg RUNTIME_BASE=tools and needs nothing from any registry. But
# ffmpeg, Ghostscript, poppler, librsvg and the fonts are ~340 MB that change a
# few times a year, while filex releases weekly — so a release pins the
# published image instead, and one that changes no tool reuses layers the
# registry already has.
#
# Run it when: the alpine base moves, a CVE lands in one of the tools, or the
# tool list in the `tools` stage changes. Then bump TOOLS_TAG in release.yml to
# the dated tag this produced — a release never picks up a new toolchain on
# its own.
#
# Architecture handling mirrors the `docker` job in release.yml: one native
# runner per architecture (no QEMU — emulating this apk layer is precisely the
# expensive thing), each pushing by digest, joined into the multi-arch tags by
# a second job.

on:
  workflow_dispatch:
    inputs:
      alpine_tag:
        description: "Tag prefix naming the base, e.g. alpine3.20"
        required: true
        default: "alpine3.20"
  # A change to the recipe is published automatically; the dated tag it gets
  # is inert until a human points release.yml at it.
  #
  # ⚠ The path is the whole application Dockerfile, so this over-triggers: an
  # edit to a frontend or Go stage republishes a toolchain identical to the
  # last one. Wasted CI, nothing more — the dated tag no release points at is
  # inert, and the floating `alpine<version>` tag is documented as never
  # pinnable by a build.
  push:
    branches: [main]
    paths: ["docker/Dockerfile", ".github/workflows/tools-image.yml"]

permissions:
  packages: write

# Same two knobs as release.yml: a fork sets the repository VARIABLES
# IMAGE_BASE (and REGISTRY, if it is not ghcr) and publishes to its own
# namespace without editing this file.
env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE: ${{ vars.IMAGE_BASE || 'ghcr.io/brf-tech' }}/filex-tools

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          # docker/ only — the `tools` stage has no COPY, so it needs nothing
          # from the repo tree, and a narrow context keeps an application change
          # from invalidating it.
          context: docker
          file: docker/Dockerfile
          target: tools
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: tools-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Nothing is tagged until BOTH architectures have pushed, so a half-built
  # toolchain never appears under a tag a release could pin.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          prefix="${{ inputs.alpine_tag || 'alpine3.20' }}"
          dated="${prefix}-$(date -u +%Y%m%d)"

          srcs=()
          for f in /tmp/digests/*; do
            srcs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          [ "${#srcs[@]}" -eq 2 ] || {
            echo "expected 2 digests, found ${#srcs[@]}" >&2
            exit 1
          }

          # The dated tag is what release.yml pins; the bare prefix is a
          # convenience for humans and must never be pinned by a build.
          docker buildx imagetools create \
            -t "${IMAGE}:${dated}" -t "${IMAGE}:${prefix}" "${srcs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${dated}"

          echo "Pin this in .github/workflows/release.yml: ${IMAGE}:${dated}" >> "$GITHUB_STEP_SUMMARY"
