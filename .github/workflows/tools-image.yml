name: Toolchain image

# Publishes ghcr.io/brf-tech/filex-tools — the programs the thumbnailer shells
# out to (docker/Dockerfile.tools), which the `full` filex image is built on.
#
# It is a separate workflow, on a separate trigger, because that is the whole
# point of the split: ffmpeg, Ghostscript, poppler, librsvg and the fonts are
# ~340 MB that change a few times a year, while filex releases weekly. Before
# the split, every release re-resolved and re-downloaded all of it on both
# architectures; now a release that changes no tool reuses layers the registry
# already has.
#
# Run it when: the alpine base moves, a CVE lands in one of the tools, or the
# tool list in docker/Dockerfile.tools changes. Then bump TOOLS_IMAGE in
# release.yml to the dated tag this produced — a release never picks up a new
# toolchain on its own.
#
# Architecture handling mirrors the `docker` job in release.yml: one native
# runner per architecture (no QEMU — emulating this apk layer is precisely the
# expensive thing), each pushing by digest, joined into the multi-arch tags by
# a second job.

on:
  workflow_dispatch:
    inputs:
      alpine_tag:
        description: "Tag prefix naming the base, e.g. alpine3.20"
        required: true
        default: "alpine3.20"
  # A change to the recipe is published automatically; the dated tag it gets
  # is inert until a human points release.yml at it.
  push:
    branches: [main]
    paths: ["docker/Dockerfile.tools", ".github/workflows/tools-image.yml"]

permissions:
  packages: write

env:
  IMAGE: ghcr.io/brf-tech/filex-tools

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          # docker/ only — the recipe needs nothing from the repo tree, and a
          # narrow context keeps an application change from invalidating it.
          context: docker
          file: docker/Dockerfile.tools
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: tools-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Nothing is tagged until BOTH architectures have pushed, so a half-built
  # toolchain never appears under a tag a release could pin.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        run: |
          set -euo pipefail
          prefix="${{ inputs.alpine_tag || 'alpine3.20' }}"
          dated="${prefix}-$(date -u +%Y%m%d)"

          srcs=()
          for f in /tmp/digests/*; do
            srcs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          [ "${#srcs[@]}" -eq 2 ] || {
            echo "expected 2 digests, found ${#srcs[@]}" >&2
            exit 1
          }

          # The dated tag is what release.yml pins; the bare prefix is a
          # convenience for humans and must never be pinned by a build.
          docker buildx imagetools create \
            -t "${IMAGE}:${dated}" -t "${IMAGE}:${prefix}" "${srcs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${dated}"

          echo "Pin this in .github/workflows/release.yml: ${IMAGE}:${dated}" >> "$GITHUB_STEP_SUMMARY"
